name: Build ads APK

# 手动触发,只跑 ads 分支上的灰鲸广告构建。原 CI 只在 main 上跑,
# 这个分支的验证就靠这一个工作流:构建 + 签名校验 + 产物上传。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ads-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # 即存专用新密钥的证书指纹(只是指纹,不是密钥本身)。
      # 密钥只存在仓库 Secrets 里,见下面「恢复正式签名身份」那一步。
      RELEASE_SIGNER_SHA256: 8897f117fbc7e55f380a397d7f8c5031addb9c83df8b6d7dc98210d2c7f96efa
      GRADLE_OPTS: "-Xmx8G -XX:MaxMetaspaceSize=4G"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 钉住版本:必须等于仓库根 .flutter-version(3.47.6),见
      # tool/check_repo_hygiene.py 的 SDK 版本单一来源判据。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6

      - run: cp lib/secrets.example.dart lib/secrets.dart

      # 正式签名:Secrets 齐了走新密钥,缺了就走 debug 签名并在产物名里
      # 讲清楚 —— 绝不产出一个「看着像 release、签名却不对」的包。
      # key.properties 与 keystore 都只活在本次运行里,最后一步删掉。
      - name: Restore the release signing identity
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::warning::No release signing secrets (%s); building with debug signing. Uninstall the existing app before installing this APK.\n' \
              "$(IFS=,; printf '%s' "${missing[*]}")"
            printf 'has_release_signing=false\n' >> "$GITHUB_OUTPUT"
            printf 'allowDebugSigning=true\n' >> android/gradle.properties
            exit 0
          fi
          umask 077
          signing_path="$RUNNER_TEMP/jicun-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_path"
          actual_signer="$(keytool -exportcert -keystore "$signing_path" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)"
          if [[ "$actual_signer" != "$RELEASE_SIGNER_SHA256" ]]; then
            echo 'The signing secret does not contain the expected release certificate.' >&2
            echo "::error::Expected $RELEASE_SIGNER_SHA256 but the secret holds $actual_signer" >&2
            exit 1
          fi
          {
            printf 'storeFile=%s\n' "$signing_path"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties
          printf 'has_release_signing=true\n' >> "$GITHUB_OUTPUT"
          printf 'Verified release signing certificate: %s\n' "$actual_signer"

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK signing
        env:
          HAS_RELEASE_SIGNING: ${{ steps.signing.outputs.has_release_signing }}
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          [[ -f "$apk" ]] || { echo "::error::APK not found at $apk" >&2; exit 1; }
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -n 1)"
          [[ -n "$apksigner" ]] || { echo '::error::apksigner not found' >&2; exit 1; }
          "$apksigner" verify --print-certs "$apk"
          case "$HAS_RELEASE_SIGNING" in
            true)
              actual="$( "$apksigner" verify --print-certs "$apk" | grep -o 'SHA-256 digest: [0-9a-f:]*' | head -n 1 | sed 's/.*: //; s/://g')"
              if [[ "$actual" != "$RELEASE_SIGNER_SHA256" ]]; then
                echo "::error::APK signer $actual does not match $RELEASE_SIGNER_SHA256" >&2
                exit 1
              fi
              echo "APK signed with the jicun release certificate."
              ;;
            false)
              echo 'APK built with debug signing (no release secrets).'
              ;;
            *)
              echo "::error::Signing step did not report has_release_signing (got '$HAS_RELEASE_SIGNING')" >&2
              exit 1
              ;;
          esac

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jicun-ads-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/jicun-release.jks"
