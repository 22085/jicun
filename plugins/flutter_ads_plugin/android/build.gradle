group = "com.flutter.ads_plugin.flutter_ads_plugin"
version = "1.0"

// Vendored into jicun (plugins/flutter_ads_plugin) with jicun-specific
// patches; see VENDORING.md. No buildscript/AGP pin here: the Flutter
// Gradle plugin supplies the AGP/Kotlin toolchain (AGP 9 / Java 17 in
// jicun's settings.gradle.kts). The upstream buildscript pinned AGP
// 7.4.2 / compileSdk 35 / Java 11 / okhttp 3.8.0 and DJX deps, which do
// not build under jicun's toolchain. DJX/TubeActivity are removed:
// jicun never calls openDJX (it has no drama player).

apply plugin: "com.android.library"

android {
    namespace = "com.flutter.ads_plugin.flutter_ads_plugin"

    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = flutter.minSdkVersion
    }
}

// The Flutter tool injects the flutter SDK path via local.properties
// (same mechanism as the upstream plugin template).
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}
def flutterRoot = localProperties.getProperty('flutter.sdk')

// AGP forbids direct local .aar file dependencies (files('libs/*.aar'))
// in a library module: they would not be packaged in the resulting AAR
// and the build fails at bundle time. The AARs are therefore exposed
// through a flatDir repository with coordinates instead; the files
// themselves are untouched in libs/.
repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    if (flutterRoot != null) {
        compileOnly files("$flutterRoot/bin/cache/artifacts/engine/android-arm/flutter.jar")
    }
    implementation "androidx.appcompat:appcompat:1.2.0"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "androidx.recyclerview:recyclerview:1.2.0"

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.googlecode.android-query:android-query:0.25.9'

    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'

    // okhttp 4.12.0; upstream 3.8.0 conflicts with newer toolchains.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.6.0'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.github.bumptech.glide:glide:3.7.0'

    // Bundled mediation AARs (Huijing 5.6.1.2 / ad-mill 5.6.1), via the
    // flatDir repository above (see the AGP note there). Names are the
    // file names minus the .aar extension.
    api(name: 'ad-mill-adscope-adapter-5.6.1.7-5.6.1', ext: 'aar')
    api(name: 'ad-mill-baidu-adapter-9.460-5.6.1', ext: 'aar')
    api(name: 'ad-mill-csj-adapter-7.8.1.4-5.6.1', ext: 'aar')
    api(name: 'ad-mill-gdt-adapter-4.710.1580-5.6.1', ext: 'aar')
    api(name: 'ad-mill-gromore-adapter-7.8.1.4-5.6.1', ext: 'aar')
    api(name: 'ad-mill-kuaishou-adapter-5.9.10.1-5.6.1', ext: 'aar')
    api(name: 'ad-mill-octopus-adapter-2.6.10.10-5.6.1', ext: 'aar')
    api(name: 'ad-mill-sdk-5.6.1', ext: 'aar')
    api(name: 'ad-mill-xbid-adapter-1.0.0-5.6.1', ext: 'aar')

    api(name: 'Baidu_MobAds_SDK-release_v9.460', ext: 'aar')
    api(name: 'beizi_fusion_sdk_5.6.1.7', ext: 'aar')
    api(name: 'GDTSDK.unionNormal.4.710.1580', ext: 'aar')

    api(name: 'hj-openads-5.6.1.2', ext: 'aar')

    api(name: 'kssdkad', ext: 'aar')
    api(name: 'octopus_ad_sdk_2.6.10.10', ext: 'aar')
    api(name: 'open_ad_sdk_7.8.1.4', ext: 'aar')
    api(name: 'wind-common-2.1.1', ext: 'aar')
    api(name: 'wind-sdk-4.25.86', ext: 'aar')
}
